name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint and unit tests
    # Copies made by the Deploy to Cloudflare button get this file too; they don't need it.
    if: github.repository == 'jotyy/vauly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bunx biome ci .
      - run: bun run test

  site:
    name: Website
    if: github.repository == 'jotyy/vauly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: e2e
      - run: bun run test:site

  e2e:
    name: End-to-end tests
    if: github.repository == 'jotyy/vauly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway values for the local test stack only.
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3100
      CORS_ORIGIN: http://localhost:3101
      VITE_SERVER_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: e2e
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/report
            e2e/results
          retention-days: 7

  one-worker:
    name: End-to-end tests, as one Worker
    if: github.repository == 'jotyy/vauly'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: e2e
      # The app as the Deploy to Cloudflare button deploys it: wrangler.jsonc under
      # `wrangler dev`, with no secrets, so the Worker makes its own and migrates its D1.
      - run: bun run test:e2e:one-worker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-one-worker
          path: |
            e2e/report
            e2e/results
          retention-days: 7
