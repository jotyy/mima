name: Feature request
description: Suggest something vauly should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what gets in the way today. A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. It's fine to leave this open.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
