name: VaulyProto
options:
  bundleIdPrefix: app.vauly.proto
  deploymentTarget:
    iOS: "17.0"
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    exactVersion: 0.9.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
targets:
  VaulyProto:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauly.proto
    sources:
      - App
      - Shared
      - path: ../../../packages/crypto/test-vectors.json
        buildPhase: resources
    dependencies:
      - target: AutoFill
      - package: Sodium
        product: Clibsodium
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: vauly proto
        UILaunchScreen: {}
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
  AutoFill:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauly.proto.autofill
    sources:
      - AutoFill
      - Shared
      - path: ../../../packages/crypto/test-vectors.json
        buildPhase: resources
    dependencies:
      - package: Sodium
        product: Clibsodium
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: vauly proto
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: true
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
    entitlements:
      path: AutoFill/AutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
  VaulyProtoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VaulyProto
  VaulyProtoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VaulyProto
schemes:
  VaulyProto:
    build:
      targets:
        VaulyProto: all
    test:
      targets: [VaulyProtoTests, VaulyProtoUITests]
